## 2. Fundamente Teoretice și Tehnologii Utilizate
> Această secțiune acoperă cerința: *Chapter theoretic 1 + subsections* și *Formatting: tables/images*.

### 2.1 Ecosistemul Android și Dezvoltarea Modernă
Dezvoltarea aplicațiilor mobile pentru sistemul de operare Android a evoluat semnificativ în ultimii ani. Tradițional, interfețele grafice erau construite folosind fișiere XML și manipulări imperative ale vederilor (*Views*) din codul Java sau Kotlin. Odată cu introducerea bibliotecii **Jetpack Compose**, paradigma a devenit una pur **declarativă**. 

În Jetpack Compose, dezvoltatorul descrie *cum* ar trebui să arate interfața la o anumită stare a datelor, iar framework-ul se ocupă cu redesenarea inteligentă (*recomposition*) doar a componentelor afectate de modificările de stare. Kotlin, ca limbaj principal recomandat de Google, oferă suport extins pentru coroutine, facilitând astfel operațiile asincrone și managementul stărilor complexe necesare într-o aplicație de navigație.

### 2.2 Algoritmi de Rutare în Rețele de Transport
Pentru a putea naviga de la un punct A la un punct B pe o hartă, sistemele geografice modelează rețeaua stradală sub forma unui graf orientat $G = (V, E)$, unde $V$ reprezintă setul de noduri (intersecțiile), iar $E$ reprezintă setul de muchii (segmentele de stradă).

Problema determinării celui mai bun traseu se reduce matematic la problema determinării drumului de cost minim între două noduri din graf. 
Cei mai cunoscuți algoritmi pentru această problemă sunt **Dijkstra** și **A*** (A-Star). A* extinde algoritmul Dijkstra prin introducerea unei funcții euristice $h(n)$ care estimează costul de la nodul curent până la nodul destinație, ghidând căutarea direct spre țintă și reducând spațiul stărilor vizitate.

**Tabelul 2.1:** Comparație între parametrii și comportamentul algoritmilor de rutare.

| Caracteristică | Algoritmul Dijkstra | Algoritmul A* (A-Star) |
| :--- | :--- | :--- |
| **Găsirea Rutei Optime** | Da (garantează costul minim) | Da (dacă euristica este admisibilă) |
| **Funcție Euristică** | Nu folosește ($h(n) = 0$) | Folosește estimare distanță (ex: Haversine) |
| **Eficiență Spațială** | Vizitează radial toate direcțiile | Orientat către destinație (mai rapid) |
| **Complexitate (Caz Mediu)** | Mai lent (explorează exhaustiv) | Foarte rapid și direct în rețele stradale |

### 2.3 Calculul Scorului de Plăcere Geografică (Cost Adaptiv)
Spre deosebire de sistemele tradiționale precum Google Maps, a căror pondere aplicată pe o muchie este strict dictată de factorul de *timp real de sosire (ETA)* sau *distanță spațială minimă*, aplicația ApexRoute prioritizează **factorul de curbură** și **diferențele de elevație**.

Astfel, funcția de cost pentru o muchie $E_{i,j}$ nu mai reprezintă lungimea segmentului, ci o formulă matematică hibridă:
`Cost = (α * Distanță) + (β * Elevație) - (γ * Curbură)`

Unde coeficienții (α, β, γ) reglează preferința matematică pe model. Dacă (γ) este masiv, funcția de penalizare devine un bonus pentru drumurile drepte, orientând A* către strazile curbate (scăzând costul pe acestea).

Procesul tehnologic prin care sistemul adaugă această greutate hibridă fiecărui segment stradal din rețeaua geografică OpenStreetMap este ilustrat în figura de mai jos:

```mermaid
flowchart TD
    A[Început: Analiză Muchie E_i,j] --> B(Extragere Long/Lat Noduri)
    B --> C{Geometrie Curbată Segment?}
    C -->|Da| D[Calcul Rază Curbură Math]
    C -->|Nu linie dreaptă| E[Factor Curbură = 0]
    D --> F[Extragere Date Elevație DEM API]
    E --> F
    F --> G[Sinteză Cost Hibrid]
    G --> H[Aplicare Muchie în Coada de Prioritate A*]
    H --> I[Următorul Nod pentru procesare]
    
    style A fill:#1E1E1E,stroke:#F9A826,stroke-width:2px,color:#FFF
    style G fill:#C78314,stroke:#A16102,stroke-width:2px,color:#FFF
    style I fill:#1E1E1E,stroke:#F9A826,stroke-width:2px,color:#FFF
```

### 3.1 Arhitectura Software — Clean Architecture

Proiectarea aplicației ApexRoute se fundamentează pe principiile **Clean Architecture** (Robert C. Martin, 2017), un model de arhitectură software ce promovează separarea strictă a responsabilităților prin straturi concentrice cu dependențe care "curg" doar din exterior spre interior [1].

Acest model garantează că logica de business (domeniul aplicației) rămâne complet independentă de detalii de implementare precum framework-ul Android, baza de date sau protocoalele de comunicare cu API-uri externe. Rezultatul practic este un cod care este mai ușor de testat, de întreținut și de evoluat pe termen lung [2].

Aplicația ApexRoute implementează trei straturi principale, fiecare cu responsabilități clar delimitate:

**Tabelul 3.1:** Straturile arhitecturale ale aplicației ApexRoute conform Clean Architecture.

| Strat | Responsabilitate | Componente Cheie | Dependențe Externe |
| :--- | :--- | :--- | :--- |
| **Presentation** (UI) | Afișarea datelor și interacțiunea cu utilizatorul | `HomeScreen`, `RoundTripSetupScreen`, `RouteResultScreen`, `ScenicRouteSetupScreen`, `ScenicRouteResultScreen`, `RoundTripViewModel`, `ScenicRouteViewModel` | Jetpack Compose, Material3, Navigation Compose |
| **Domain** (Business Logic) | Definirea regulilor de business și a entităților | `GeoPoint`, `Route`, `RouteRepository` (interfață), `GenerateRoundTripUseCase`, `GenerateScenicRouteUseCase` | Niciuna (pur Kotlin) |
| **Data** (Persistență & Rețea) | Accesul la surse de date (API, algoritmi) | `RouteRepositoryImpl`, `OsmApi`, `RoadGraph`, `RoundTripGenerator` | HttpURLConnection, Overpass API, Mapbox GL JS |

Relația dintre straturi este unidirecțională: stratul *Presentation* depinde de *Domain*, iar *Domain* definește interfețe (porturi) pe care stratul *Data* le implementează prin inversiunea dependenței (*Dependency Inversion Principle* — SOLID) [3].

## 4. Cerințe și Specificația Aplicației
> Această secțiune acoperă cerința: *Chapter practical 1 + requirements/specification*.

### 4.1 Descrierea Generală a Produsului

**ApexRoute** este o aplicație mobilă nativă Android concepută pentru pasionații de conducere auto care prioritizează **experiența de conducere** în defavoarea eficienței temporale sau a distanței minime. Aplicația generează trasee optimizate pentru plăcerea la volan, maximizând factori precum curbele, diferențele de elevație și peisajele scenic.

**Tabelul 4.1:** Fișa de identitate a produsului software.

| Atribut | Valoare |
| :--- | :--- |
| **Nume Produs** | ApexRoute |
| **Tip Aplicație** | Aplicație mobilă nativă Android |
| **Platformă Țintă** | Android 8.0+ (API Level 26) |
| **Limbaj de Programare** | Kotlin 2.0+ |
| **Framework UI** | Jetpack Compose + Material Design 3 |
| **Paradigmă Arhitecturală** | Clean Architecture (3 straturi) |
| **Domeniu** | Navigație auto orientată pe plăcere de conducere |
| **Utilizator Țintă** | Pasionați auto, motocicliști, conducători recreativi |

### 4.2 Cerințe Funcționale

Cerințele funcționale descriu comportamentele și funcționalitățile pe care sistemul trebuie să le ofere utilizatorului. Fiecare cerință este identificată unic și clasificată după prioritate conform metodologiei MoSCoW (Must/Should/Could/Won't) [5].

**Tabelul 4.2:** Specificarea cerințelor funcționale ale aplicației ApexRoute.

| ID | Cerință Funcțională | Descriere Detaliată | Prioritate | Stare |
| :--- | :--- | :--- | :--- | :--- |
| **CF-01** | Generare Traseu Circular (Round Trip) | Utilizatorul introduce o durată dorită (15–240 min) și un punct de plecare (GPS, hartă interactivă sau căutare adresă). Sistemul generează un traseu circular fără repetare de segmente, optimizat pentru scorul de plăcere maxim. Algoritmul utilizează căutare multi-rază cu excludere de muchii pentru bucle reale. | Must Have | ✅ Implementat |
| **CF-02** | Generare Traseu Scenic A→B | Utilizatorul introduce două puncte (A și B) prin căutare de adresă (geocodare Mapbox). Sistemul calculează un traseu scenic între cele două puncte care maximizează curbele, folosind A* cu cost hibrid de plăcere. | Must Have | ✅ Implementat |
| **CF-03** | Vizualizare Hartă Interactivă | Harta interactivă Mapbox GL JS (temă dark) afișează traseul generat cu efect de strălucire (glow), marcator de start/destinație, și posibilitate de zoom, pan și rotire. Round Trip folosește culoare amber, Scenic Route folosește culoare albastră cu marcatoare verde (start) și roșu (destinație). | Must Have | ✅ Implementat |
| **CF-04** | Afișare Detalii Traseu | După generarea unui traseu, sistemul afișează într-un card bottom-sheet: distanța totală (km), durata estimată (min), scorul mediu de plăcere (0–10), și numărul de curbe semnificative. | Must Have | ✅ Implementat |
| **CF-05** | Configurare Preferințe Conducere | Utilizatorul poate ajusta coeficienții (α, β, γ) ai funcției de cost hibrid pentru a personaliza tipul de traseu preferat (ex: mai multe curbe vs. mai multă elevație). | Should Have | 📋 Planificat |
| **CF-06** | Selectare Punct pe Hartă | Utilizatorul poate selecta punctele de start/destinație prin atingere directă pe harta interactivă Mapbox, prin căutare de adresă cu geocodare, sau prin GPS. | Should Have | ✅ Implementat |
| **CF-07** | Istoric Trasee Generate | Sistemul salvează local traseele generate anterior, permițând utilizatorului să le revizieze și să le reutilizeze fără recalculare. | Could Have | 📋 Planificat |
| **CF-08** | Export Traseu (GPX) | Utilizatorul poate exporta un traseu generat în format GPX pentru utilizare cu alte aplicații de navigație sau dispozitive GPS dedicate. | Could Have | 📋 Planificat |

## 5. Detalii de Implementare
> Această secțiune acoperă cerința: *Chapter from the practical part: design (all) + implementation*.

### 5.1 Modelul de Date al Domeniului

Stratul Domain definește două entități fundamentale, implementate ca `data class` Kotlin, fără nicio dependență de framework-ul Android:

**`GeoPoint`** — Reprezintă un punct geografic cu latitudine și longitudine. Include metode statice pentru calculul distanței Haversine între două puncte, offset-ul unui punct la o distanță și unghi dat, și calculul direcției (bearing) între două puncte. Aceste funcții matematice sunt esențiale pentru algoritmul de generare a traseelor.

**`Route`** — Entitatea principală returnată de algoritmul de generare. Conține: un identificator unic (UUID), lista de puncte geografice ale traseului, distanța totală (km), durata estimată (minute), scorul de plăcere (0–10), și numărul de curbe semnificative detectate.

### 5.2 Algoritmul A* Modificat cu Cost Hibrid de Plăcere

Nucleul inovator al aplicației ApexRoute rezidă în modificarea funcției de cost a algoritmului A* clasic. În loc să minimizeze distanța sau timpul de parcurgere, algoritmul nostru minimizează un **cost hibrid** care recompensează drumurile curbate:

```
Cost(E_ij) = max(α·d - γ·c·d, 0.1·d)
```

Unde `d` = distanța segmentului (m), `c` = scorul de curbură (0–1), `α = 1.0` (greutatea distanței), `γ = 2.5` (recompensa curburilor). Pragul inferior `0.1·d` previne costurile negative.

Scorul de curbură per segment este calculat automat din geometria nodurilor OpenStreetMap prin analiza unghiurilor succesive dintre punctele segmentului de drum. Un segment perfect drept primește scorul 0, iar un segment foarte curbat primește un scor apropiat de 1.

### 5.3 Generarea Traseului Circular (Round Trip) — Strategia Multi-Rază cu Excludere de Muchii

Algoritmul de generare a traseelor circulare folosește o strategie în mai mulți pași:

**Pasul 1: Plasare Puncte de Referință (Waypoints)**
Se plasează N puncte (3 sau 4) într-un cerc în jurul punctului de start, la o rază calculată din distanța țintă. Fiecare punct este „snap-at" la cel mai apropiat nod din graful stradal.

**Pasul 2: Căutare Multi-Rază**
Algoritmul încearcă 7 scale de rază diferite (0.5x–1.8x) pentru a găsi trasee la distanțe variate. Pentru fiecare rază, se testează 8 rotații de offset ale punctelor de referință. Aceasta produce **112 candidați** per generare.

**Pasul 3: Înlănțuire A* cu Excludere de Muchii**
Traseul este construit prin înlănțuirea segmentelor A* între waypoints consecutive: `start → wp1 → wp2 → wp3 → start`. **Inovația critică**: după fiecare segment, muchiile utilizate sunt marcate. Segmentele ulterioare aplică o **penalizare de 20× cost** pe muchiile deja parcurse, forțând algoritmul să găsească drumuri diferite pentru fiecare etapă. Acest mecanism elimină pattern-ul „dus-întors" și produce bucle reale.

**Pasul 4: Verificare Unicitate**
Traseele cu mai mult de 30% segmente repetate sunt respinse automat. Dintre candidații rămași, se selectează traseul cu scorul combinat maxim: **70% precizia distanței + 30% scorul de plăcere**.

```mermaid
flowchart TD
    A[Punct de Start + Distanță Țintă] --> B[Generare 7 Scale de Rază]
    B --> C[Pentru fiecare rază: Plasare 3-4 Waypoints]
    C --> D[Snap Waypoints la Graful Stradal]
    D --> E["Înlănțuire A* cu Excludere Muchii"]
    E --> F{Rată Unicitate > 70%?}
    F -->|Da| G[Calcul Scor Combinat]
    F -->|Nu| H[Respingere Traseu]
    G --> I[Selectare Cel Mai Bun Candidat]
    H --> C

    style A fill:#1E1E1E,stroke:#F9A826,stroke-width:2px,color:#FFF
    style E fill:#1a237e,stroke:#F9A826,stroke-width:2px,color:#FFF
    style I fill:#C78314,stroke:#A16102,stroke-width:2px,color:#FFF
```

### 5.4 Generarea Traseului Scenic A→B

Traseul scenic între două puncte este conceptual mai simplu: se execută un singur apel A* de la punctul A la punctul B, folosind aceeași funcție de cost hibrid de plăcere. Diferențele față de navigația tradițională sunt:

1. **Zona de căutare**: Se calculează un bounding box care acoperă ambele puncte cu 30% padding suplimentar, asigurând acces la rute alternative
2. **Funcția de cost**: Identică cu cea din Round Trip — prioritizează drumurile curbate
3. **Vizualizare diferită**: Linia de traseu folosește culoare albastră (#4FC3F7), cu marcator verde pentru start și roșu pentru destinație

### 5.5 Integrarea cu OpenStreetMap Overpass API

Clientul `OsmApi` comunică cu API-ul Overpass pentru a prelua rețeaua stradală dintr-o zonă geografică. Implementarea include:

- **Query Overpass QL**: Filtrare pe tipuri de drumuri conducibile (`motorway`, `trunk`, `primary`, `secondary`, `tertiary`, `unclassified`, `residential`)
- **Reziliență**: 4 endpoint-uri mirror (`overpass.kumi.systems`, `z.overpass-api.de`, `lz4.overpass-api.de`, `overpass-api.de`) cu fallback automat în caz de erori DNS — esențial pentru compatibilitate cu emulatoarele Android
- **Parsare JSON**: Extragerea nodurilor (coordonate lat/lon) și a way-urilor (secvențe de noduri + tag-uri) din răspunsul API

Datele OSM sunt transformate într-un graf direcționat (`RoadGraph`) unde nodurile reprezintă intersecțiile, iar muchiile conțin: distanța (m), scorul de curbură, și direcționalitatea (suport pentru drumuri cu sens unic).

### 5.6 Integrarea Mapbox GL JS prin WebView

Vizualizarea traseelor pe hartă se realizează prin embedding-ul **Mapbox GL JS v3.4** într-un `WebView` Android. S-a optat pentru această abordare (în loc de SDK-ul nativ Mapbox Android) din următoarele motive:

1. **Simplicitate**: Nu necesită descărcarea unui SDK voluminous (~30 MB)
2. **Stilizare avansată**: Acces direct la stilurile vectoriale Mapbox (temă `dark-v11`)
3. **Performanță**: WebGL oferă performanță excelentă pentru redarea hărților vectoriale

**Strategia de embedding**: HTML-ul este generat dinamic cu coordonatele traseului deja incluse în codul JavaScript. Aceasta elimină problemele de timing la comunicarea între Android și WebView — traseul se desenează automat la evenimentul `map.on('load')`.

Traseul este randat cu un efect de strălucire dublu-strat: un strat de blur (lățime 12px, opacitate 25%) și un strat principal (lățime 4px, opacitate 95%).

### 5.7 Geocodarea Adreselor cu Mapbox Geocoding API

Selectarea punctelor de start/destinație prin adresă text este implementată prin **Mapbox Geocoding API v5**. La introducerea unei adrese (ex: „Strada Memorandumului, Cluj"), se execută un request HTTP GET:

```
https://api.mapbox.com/geocoding/v5/mapbox.places/{query}.json
  ?access_token={token}&limit=5&language=ro
```

Răspunsul JSON conține până la 5 rezultate, fiecare cu: numele locației, adresa completă, și coordonatele (longitudine, latitudine). Rezultatele sunt afișate într-o listă interactivă din care utilizatorul selectează locația dorită.

### 6.3 Mini-Manual de Utilizare

**Pasul 1: Lansarea Aplicației**
La deschiderea aplicației ApexRoute, sistemul afișează ecranul principal cu două opțiuni: „Round Trip Generator" și „Scenic Route A to B".

**Pasul 2a: Generare Traseu Circular (Round Trip)**
1. Apăsați pe cardul „Round Trip Generator"
2. Setați durata dorită prin slider sau apăsând pe numărul de minute pentru a introduce valoarea manual
3. Selectați punctul de plecare: apăsați „Use GPS" pentru locația curentă, „Pick on Map" pentru a alege pe hartă, sau „Address" pentru a căuta o adresă
4. Apăsați „Generate Route" — aplicația descarcă rețeaua stradală și generează traseul
5. Vizualizați traseul pe harta Mapbox cu detalii (distanță, durată, scor plăcere, curbe)

**Pasul 2b: Generare Traseu Scenic A→B**
1. Apăsați pe cardul „Scenic Route A to B"
2. Apăsați pe secțiunea „Starting Point (A)" și căutați adresa de plecare
3. Apăsați pe secțiunea „Destination (B)" și căutați adresa de destinație
4. Apăsați „Generate Scenic Route"
5. Vizualizați traseul scenic pe hartă (linie albastră cu marcator verde la start și roșu la destinație)

**Pasul 3: Regenerare sau Navigare Înapoi**
Pe ecranul cu rezultatul, apăsați iconița de refresh (↻) pentru a reveni la configurare și a genera un traseu nou, sau apăsați săgeata back (←) pentru a reveni la ecranul principal.

## 7. Concluzii și Direcții Viitoare

### 7.1 Rezumatul Realizărilor

Aplicația ApexRoute a fost implementată cu succes conform principiilor Clean Architecture, oferind două funcționalități principale: generarea de trasee circulare optimizate pentru plăcerea la volan și planificarea de rute scenice între două puncte. Algoritmul A* modificat cu cost hibrid de plăcere și mecanismul de excludere a muchiilor reprezintă contribuția inovatoare principală a acestei lucrări.

Stiva tehnologică (Kotlin, Jetpack Compose, Navigation Compose, Mapbox GL JS, OpenStreetMap Overpass API) s-a dovedit adecvată pentru cerințele proiectului, oferind performanță, flexibilitate și o experiență de utilizare modernă.

### 7.2 Direcții Viitoare

- **Date de elevație**: Integrarea unui API de elevație (ex: Open-Elevation) pentru a include diferențele de altitudine în funcția de cost
- **Navigație în timp real**: Ghidare turn-by-turn cu indicații vocale
- **Export GPX**: Salvarea traseelor în format standard pentru dispozitive GPS
- **Mod offline**: Cache-area datelor OSM pentru generare de trasee fără conexiune la internet
- **Machine Learning**: Învățarea preferințelor individuale ale utilizatorului din istoricul de trasee
